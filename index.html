<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="stylesheet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <title>Poke Center</title>
</head>

<body>
  <div class="grid-container">
    <div class="header">
      <img src="/images/magnify.svg" width="20" alt="magnifying icon">
      <input class="search-bar" type="text">
      <img src="/images/bell-ring-outline.svg" width="20" alt="bell icon">
      <img class="pokeball-icon" src="/images/Poké_Ball_icon.svg" width="30" alt="Poke ball icon">
      <h2>Ash Ketchum</h2>

      <h3>Hi there,</h3>
      <h1>Ash Ketchum(@ash)</h1>
      <button class="new-btn">New</button>
      <button class="upload-btn">Upload</button>
      <button class="share-btn">Share</button>
    </div>

    <div class="sidebar">
      <div class="logo-title">
        <h2><img class="dashboard-icon" src="/images/view-dashboard.svg" width="40" alt="dashboard icon"> Dashboard</h2>
      </div>
      <ul class="sidebar-nav">
        <li><img src="/images/home.svg" width="25px" alt="home icon">Home</li>
        <li><img src="/images/card-account-details.svg" width="25px" alt="profile icon">Profile</li>
        <li><img src="/images/message.svg" width="25px" alt="message icon">Mesages</li>
        <li><img src="/images/history.svg" width="25px" alt="history icon">History</li>
        <li><img src="images/note.svg" width="25px" alt="task icon">Tasks</li>
        <li><img src="/images/account-group.svg" width="25px" alt="people icon">Communities</li>
      </ul>
      <ul class="sidebar-general">
        <li><img src="/images/cog.svg" width="25px" alt="setting icon">Settings</li>
        <li><img src="/images/chat-question.svg" width="25px" alt="support icon">Support</li>
        <li><img src="/images/shield-lock.svg" width="25px" alt="privacy icon">Privacy</li>
      </ul>
    </div>


  </div>
</body>

</html>
